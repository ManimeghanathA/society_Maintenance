services:
  - type: web
    name: society-maintenance-tracker
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn society_tracker.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: society-maintenance-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
databases:
  - name: society-maintenance-db
