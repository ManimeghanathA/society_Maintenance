{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Notifications</h1>
  <form method="post">{% csrf_token %}<button class="btn btn-outline-primary">Mark all read</button></form>
</div>
{% for item in notifications %}
  <div class="panel mb-2 {% if not item.read %}unread{% endif %}">
    {% if item.link %}<a href="{{ item.link }}">{{ item.message }}</a>{% else %}{{ item.message }}{% endif %}
    <small class="d-block text-muted">{{ item.created_at|date:"d M Y, h:i A" }}</small>
  </div>
{% empty %}
  <p>No notifications.</p>
{% endfor %}
{% endblock %}
