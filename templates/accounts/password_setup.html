{% extends "base.html" %}
{% block content %}
<div class="auth-panel mx-auto">
  <h1>Set Password</h1>
  <p class="text-muted">Create a private password for {{ setup_user.email }}.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Set password</button>
  </form>
</div>
{% endblock %}
