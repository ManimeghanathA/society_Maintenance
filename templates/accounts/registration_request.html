{% extends "base.html" %}
{% block content %}
<div class="auth-panel mx-auto">
  <h1>Send Create Request</h1>
  <p class="text-muted">Send your name and email to admin. If approved, you will receive a private one-time password setup link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Send request</button>
    <a class="btn btn-link" href="{% url 'login' %}">Back to login</a>
  </form>
</div>
{% endblock %}
